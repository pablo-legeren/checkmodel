site_name: checkmodel
site_description: One-call diagnostics for statistical models, a Python port of R's performance package.
site_url: https://pablo-legeren.github.io/checkmodel/
repo_url: https://github.com/pablo-legeren/checkmodel
repo_name: pablo-legeren/checkmodel
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Supported models: supported-models.md
  - Examples:
      - Quickstart: examples/quickstart.ipynb
      - Linear regression: examples/01_linear_regression.ipynb
      - Logistic regression: examples/02_logistic_regression.ipynb
      - Comparing models: examples/03_model_comparison.ipynb
      - Mixed models: examples/04_mixed_models.ipynb
      - Coming from R: examples/05_coming_from_r.ipynb
      - Bayesian models: examples/06_bayesian_models.ipynb
  - API reference: api-reference.md
  - Comparison with R: comparison-with-r.md
  - Changelog: changelog.md

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.sections
    - navigation.top
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocs-jupyter:
      notebook_dirs:
        examples: examples
      execute: false
      include_source: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
